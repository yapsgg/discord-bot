services:
  - type: web
    name: yapsgg-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      - key: MAX_UPLOAD_MB
        value: 8
      - key: ENABLE_MESSAGE_CONTENT
        value: "false"
      - key: COOKIES_FILE
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_MODEL
        value: deepseek/deepseek-v4-flash-0731:free
